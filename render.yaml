services:
  - type: web
    name: horizon-app
    env: python
    plan: free
    region: oregon
    buildCommand: |
      apt-get update && apt-get install -y nodejs npm
      cd backend && chmod +x render-build.sh && ./render-build.sh
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://horizon-app.onrender.com

