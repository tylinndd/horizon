# Render Blueprint - Single Service Deployment
# FastAPI serves both API and React frontend

services:
  - type: web
    name: horizon
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      # Install Node.js
      curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
      apt-get install -y nodejs
      # Build backend
      cd backend && pip install --upgrade pip setuptools wheel
      pip install setuptools>=65.0.0 wheel>=0.38.0
      pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt
      alembic upgrade head
      # Build frontend
      cd ../frontend && npm install --legacy-peer-deps && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: horizon-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: horizon-db
    databaseName: horizon
    user: horizon
    plan: free

